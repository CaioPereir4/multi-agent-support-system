[project]
name = "getnet-support-system"
version = "1.0.0"
description = "Multi-agent customer support system for Getnet, built on AWS Bedrock + LangGraph."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }

dependencies = [
    # --- Agentes / LLM -----------------------------------------------------
    "langchain>=1.3.0",
    "langgraph>=1.2.0",
    "langchain-aws>=1.7.0",           # Bedrock: chat + embeddings Titan
    "langchain-tavily>=0.2.0",        # busca web e crawl da ingestão
    "langchain-text-splitters>=1.0.0",
    # --- API ---------------------------------------------------------------
    "fastapi>=0.141.0",
    "uvicorn[standard]>=0.52.0",
    "pydantic>=2.13.0",
    "pydantic-settings>=2.7.0",
    "httpx>=0.28.0",                  # usado pelo runner de avaliação (--http)
    # --- Observabilidade ---------------------------------------------------
    "structlog>=25.1.0",
    "dotenv>=0.9.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.25.0",
    "pytest-cov>=6.0.0",
    "respx>=0.22.0",
    "ruff>=0.9.0",
    "mypy>=1.14.0",
]

[project.scripts]
getnet-ingest = "support_system.rag.ingest:main"
getnet-eval = "evals.run_eval:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/"]

[tool.uv]
package = true

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-q --strict-markers"
markers = [
    "live: tests that hit real AWS Bedrock / Tavily / Postgres (deselected by default)",
]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests", "evals"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "C4", "RUF"]
ignore = ["B008", "RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.isort]
known-first-party = ["support_system", "evals", "tests"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
plugins = []
